<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SteamVault - Steam clone store with real game deals.">
  <title>SteamVault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231b2838'/><circle cx='50' cy='50' r='20' stroke='%2367c1f5' stroke-width='4' fill='none'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.06 2 11.04c0 3.13 1.81 5.87 4.5 7.35l2.68-1.1a2.5 2.5 0 0 1 1.82.04l1.97.82a3.5 3.5 0 1 1 3.64-5.47 3.5 3.5 0 0 1-.61 4.95l-2.08 1.66C20.1 18.52 22 15.02 22 11.04 22 6.06 17.52 2 12 2z" fill="#67c1f5"/><circle cx="15.5" cy="9.5" r="2.5" stroke="#c7d5e0" stroke-width="1.5" fill="none"/><circle cx="7" cy="15" r="1.8" fill="#c7d5e0"/></svg>
        <span class="header-logo-text">STEAM</span>
      </div>
      <div class="header-profile">
        <span class="header-wallet" id="wallet"><span id="wallet-amount">250.00</span> EUR</span>
        <span class="header-profile-name">Player</span>
      </div>
    </div>
    <nav class="header-nav">
      <div class="nav-links">
        <button class="nav-link active" id="nav-store" onclick="showPage('store')">Store</button>
        <button class="nav-link" id="nav-library" onclick="showPage('library')">Library <span class="badge" id="library-count"></span></button>
        <button class="nav-link" id="nav-wishlist" onclick="showPage('wishlist')">Wishlist <span class="badge" id="wishlist-count"></span></button>
        <button class="nav-link" id="nav-cart" onclick="showPage('cart')">Cart <span class="badge" id="cart-count"></span></button>
        <button class="nav-link" id="nav-play" onclick="showPage('play')" style="color:#a4d007;">Play</button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search the store" autocomplete="off">
        <button onclick="searchGames()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#c7d5e0" stroke-width="2" fill="none"/><path d="M21 21l-4.35-4.35" stroke="#c7d5e0" stroke-width="2"/></svg></button>
      </div>
    </nav>
  </header>

  <div class="main">
    <section class="page-view active" id="page-store">
      <div class="featured" id="featured-section"></div>
      <div class="store-toolbar">
        <div class="section-header">
          <h1 class="section-title" id="store-title">Special Offers</h1>
          <span class="section-more" id="store-subtitle"></span>
        </div>
        <select class="sort-select" id="sort-select" onchange="sortGames()">
          <option value="deal">Best Deal</option>
          <option value="price">Lowest Price</option>
          <option value="title">Name A-Z</option>
          <option value="metacritic">Metacritic</option>
        </select>
      </div>
      <div id="game-grid" class="game-grid"></div>
      <div id="store-loader" class="loader" style="display:none;"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
    </section>
    <section class="page-view" id="page-library">
      <div class="section-header"><h1 class="section-title">My Library</h1><span class="section-more" id="library-subtitle">0 games</span></div>
      <div id="library-list" class="library-list"></div>
    </section>
    <section class="page-view" id="page-wishlist">
      <div class="section-header"><h1 class="section-title">Wishlist</h1><span class="section-more" id="wishlist-subtitle">0 games</span></div>
      <div id="wishlist-list" class="library-list"></div>
    </section>
    <section class="page-view" id="page-cart">
      <div class="section-header"><h1 class="section-title">Shopping Cart</h1><span class="section-more" id="cart-subtitle">0 items</span></div>
      <div id="cart-list" class="library-list"></div>
      <div id="cart-summary" class="cart-summary" style="display:none;">
        <div><div class="cart-total-label">Estimated Total</div><div class="cart-total-value" id="cart-total">0.00 EUR</div></div>
        <button class="btn-purchase" id="btn-purchase-cart" onclick="purchaseCart()">Purchase for myself</button>
      </div>
    </section>
    <section class="page-view" id="page-play">
      <div class="play-header" id="play-header">
        <button class="play-back-btn" onclick="showPage('library')">&larr; Back to Library</button>
        <span class="play-game-name" id="play-game-name"></span>
        <button class="play-fullscreen-btn" onclick="togglePlayFullscreen()">Fullscreen</button>
      </div>
      <div class="play-loading" id="play-loading" style="display:none;">
        <div class="play-loading-inner">
          <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
          <div class="play-loading-title" id="play-loading-title">Generating game...</div>
          <div class="play-loading-sub" id="play-loading-sub">Analyzing game lore, characters and mechanics via AI</div>
          <div class="play-loading-model" id="play-loading-model"></div>
        </div>
      </div>
      <iframe id="play-iframe" class="play-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
    </section>
  </div>

  <!-- Hover popup for game cards -->
  <div class="game-hover-popup" id="game-hover-popup"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModalForce()">X</button>
      <img class="modal-hero" id="modal-hero" src="" alt="Game banner">
      <div class="modal-content">
        <div class="modal-left">
          <h2 class="modal-game-title" id="modal-title"></h2>
          <div class="modal-rating-row"><span class="modal-rating-tag neutral" id="modal-rating-tag"></span><span class="modal-rating-count" id="modal-rating-count"></span></div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-screenshots" id="modal-screenshots"></div>
          <div class="purchase-box">
            <div class="purchase-title" id="purchase-title">Buy this game</div>
            <div class="purchase-row">
              <span class="discount-badge" id="modal-discount" style="display:none;"></span>
              <div class="price-stack"><span class="price-original" id="modal-price-original"></span><span class="price-final" id="modal-price-final"></span></div>
              <button class="btn-add-cart" id="modal-buy-btn" onclick="buyFromModal()">Add to Cart</button>
              <button class="btn-wishlist-toggle" id="modal-wish-btn" onclick="toggleWishlist()">Add to Wishlist</button>
            </div>
          </div>
        </div>
        <div class="modal-right" id="modal-info-panel"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="app.js"></script>
  <script src="ai-game.js"></script>
</body>
</html>
