<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SteamVault - Clon de Steam. Busca juegos reales, compra de forma simulada y gestiona tu biblioteca.">
  <title>SteamVault — Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <div class="header-top">
      <div class="header-logo">
        <span style="font-size:1.4rem;">🎮</span>
        <span class="header-logo-text">STEAM</span>
      </div>
      <div class="header-profile">
        <span class="header-wallet" id="wallet">💰 <span id="wallet-amount">250.00</span>€</span>
        <span class="header-profile-name">Jugador</span>
        <span style="font-size:1.2rem;">👤</span>
      </div>
    </div>
    <nav class="header-nav">
      <div class="nav-links">
        <button class="nav-link active" id="nav-store" onclick="showPage('store')">
          Store
        </button>
        <button class="nav-link" id="nav-library" onclick="showPage('library')">
          Library
          <span class="badge" id="library-count"></span>
        </button>
        <button class="nav-link" id="nav-wishlist" onclick="showPage('wishlist')">
          Wishlist
          <span class="badge" id="wishlist-count"></span>
        </button>
        <button class="nav-link" id="nav-cart" onclick="showPage('cart')">
          Cart
          <span class="badge" id="cart-count"></span>
        </button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search the store" autocomplete="off">
        <button onclick="searchGames()">🔍</button>
      </div>
    </nav>
  </header>

  <!-- ═══ MAIN ═══ -->
  <div class="main">

    <!-- STORE PAGE -->
    <section class="page-view active" id="page-store">
      <!-- Featured Carousel -->
      <div class="featured" id="featured-section"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="section-header" style="flex:1;margin-bottom:0;">
          <h1 class="section-title" id="store-title">Special Offers</h1>
          <span class="section-more" id="store-subtitle"></span>
        </div>
        <select class="sort-select" id="sort-select" onchange="sortGames()">
          <option value="deal">Best Deal</option>
          <option value="price">Lowest Price</option>
          <option value="title">Name A-Z</option>
          <option value="metacritic">Metacritic</option>
        </select>
      </div>

      <div id="game-grid" class="game-grid"></div>
      <div id="store-loader" class="loader" style="display:none;">
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
      </div>
    </section>

    <!-- LIBRARY PAGE -->
    <section class="page-view" id="page-library">
      <div class="section-header"><h1 class="section-title">My Library</h1><span class="section-more" id="library-subtitle">0 games</span></div>
      <div id="library-list" class="library-list"></div>
    </section>

    <!-- WISHLIST PAGE -->
    <section class="page-view" id="page-wishlist">
      <div class="section-header"><h1 class="section-title">Wishlist</h1><span class="section-more" id="wishlist-subtitle">0 games</span></div>
      <div id="wishlist-list" class="library-list"></div>
    </section>

    <!-- CART PAGE -->
    <section class="page-view" id="page-cart">
      <div class="section-header"><h1 class="section-title">Shopping Cart</h1><span class="section-more" id="cart-subtitle">0 items</span></div>
      <div id="cart-list" class="library-list"></div>
      <div id="cart-summary" class="cart-summary" style="display:none;">
        <div>
          <div class="cart-total-label">Estimated Total</div>
          <div class="cart-total-value" id="cart-total">0.00€</div>
        </div>
        <button class="btn-purchase" id="btn-purchase-cart" onclick="purchaseCart()">Purchase for myself</button>
      </div>
    </section>
  </div>

  <!-- ═══ GAME DETAIL MODAL ═══ -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModalForce()">✕</button>
      <img class="modal-hero" id="modal-hero" src="" alt="Game banner">
      <div class="modal-content">
        <div class="modal-left">
          <h2 class="modal-game-title" id="modal-title">—</h2>
          <div class="modal-rating-row">
            <span class="modal-rating-tag neutral" id="modal-rating-tag"></span>
            <span class="modal-rating-count" id="modal-rating-count"></span>
          </div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-screenshots" id="modal-screenshots"></div>
          <div class="purchase-box">
            <div class="purchase-title" id="purchase-title">Buy this game</div>
            <div class="purchase-row">
              <span class="discount-badge" id="modal-discount" style="display:none;"></span>
              <div class="price-stack">
                <span class="price-original" id="modal-price-original"></span>
                <span class="price-final" id="modal-price-final"></span>
              </div>
              <button class="btn-add-cart" id="modal-buy-btn" onclick="buyFromModal()">Add to Cart</button>
              <button class="nav-link" id="modal-wish-btn" onclick="toggleWishlist()" style="font-size:1rem;padding:6px 10px;" title="Wishlist">💜</button>
            </div>
          </div>
        </div>
        <div class="modal-right" id="modal-info-panel"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
