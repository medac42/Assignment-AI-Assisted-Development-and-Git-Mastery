<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SteamVault - Tu tienda de videojuegos simulada. Busca juegos reales, compra de forma simulada y gestiona tu biblioteca.">
  <title>SteamVault — Tienda de Juegos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ NAVBAR ═══ -->
  <nav class="navbar" id="navbar">
    <a href="#" class="logo" onclick="showPage('store')">
      <span class="logo-icon">🎮</span>
      <span class="logo-text">STEAMVAULT</span>
    </a>

    <div class="nav-links">
      <button class="nav-btn active" id="nav-store" onclick="showPage('store')">
        🏪 Tienda
      </button>
      <button class="nav-btn" id="nav-library" onclick="showPage('library')">
        📚 Biblioteca
        <span class="cart-badge" id="library-count"></span>
      </button>
      <button class="nav-btn" id="nav-cart" onclick="showPage('cart')">
        🛒 Carrito
        <span class="cart-badge" id="cart-count"></span>
      </button>
    </div>

    <div class="wallet" id="wallet">
      💰 <span id="wallet-amount">250.00</span>€
    </div>
  </nav>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="app-container">

    <!-- ─── STORE PAGE ─── -->
    <section class="page-view active" id="page-store">
      <div class="search-section">
        <div class="search-bar">
          <input
            type="text"
            class="search-input"
            id="search-input"
            placeholder="Buscar juegos... (ej: GTA, Zelda, FIFA)"
            autocomplete="off"
          >
          <button class="search-btn" id="search-btn" onclick="searchGames()">
            🔍 Buscar
          </button>
        </div>
      </div>

      <div class="section-header">
        <h1 class="section-title" id="store-title">🔥 Juegos Populares</h1>
        <span class="section-subtitle" id="store-subtitle">Los más jugados esta semana</span>
      </div>

      <div id="game-grid" class="game-grid">
        <!-- Games loaded dynamically -->
      </div>

      <div id="store-loader" class="loader" style="display:none;">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </section>

    <!-- ─── LIBRARY PAGE ─── -->
    <section class="page-view" id="page-library">
      <div class="section-header">
        <h1 class="section-title">📚 Mi Biblioteca</h1>
        <span class="section-subtitle" id="library-subtitle">0 juegos</span>
      </div>
      <div id="library-list" class="library-list"></div>
    </section>

    <!-- ─── CART PAGE ─── -->
    <section class="page-view" id="page-cart">
      <div class="section-header">
        <h1 class="section-title">🛒 Carrito de Compra</h1>
        <span class="section-subtitle" id="cart-subtitle">0 artículos</span>
      </div>
      <div id="cart-list" class="library-list"></div>
      <div id="cart-summary" style="margin-top:1.5rem; display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:1.2rem 1.5rem;">
          <div>
            <div style="color:var(--text-muted); font-size:0.8rem;">TOTAL</div>
            <div style="font-family:'Orbitron',sans-serif; font-size:1.8rem; font-weight:700; color:var(--accent-green);" id="cart-total">0.00€</div>
          </div>
          <button class="btn-buy" onclick="purchaseCart()" id="btn-purchase-cart" style="flex:unset; padding:0.9rem 2rem;">
            💳 Comprar Todo
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══ GAME DETAIL MODAL ═══ -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModalForce()">✕</button>
      <img class="modal-hero" id="modal-hero" src="" alt="Game banner">
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title">—</h2>
        <div class="modal-rating">
          <span class="rating-stars" id="modal-stars"></span>
          <span class="rating-text" id="modal-rating-text"></span>
        </div>
        <div class="modal-genres" id="modal-genres"></div>
        <p class="modal-desc" id="modal-desc"></p>
        <div class="modal-info-grid" id="modal-info-grid"></div>
        <div class="modal-actions">
          <span class="modal-price" id="modal-price"></span>
          <button class="btn-buy" id="modal-buy-btn" onclick="buyFromModal()">
            🛒 Añadir al Carrito
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ TOAST CONTAINER ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="app.js"></script>
</body>
</html>
