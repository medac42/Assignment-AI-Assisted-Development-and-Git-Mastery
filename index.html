<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SteamVault - Clon de Steam. Busca juegos reales y compra de forma simulada.">
  <title>SteamVault — Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-logo">
        <!-- Steam SVG icon (no background) -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.06 2 11.04c0 3.13 1.81 5.87 4.5 7.35l2.68-1.1a2.5 2.5 0 0 1 1.82.04l1.97.82a3.5 3.5 0 1 1 3.64-5.47 3.5 3.5 0 0 1-.61 4.95l-2.08 1.66C20.1 18.52 22 15.02 22 11.04 22 6.06 17.52 2 12 2z" fill="#67c1f5"/>
          <circle cx="15.5" cy="9.5" r="2.5" stroke="#c7d5e0" stroke-width="1.5" fill="none"/>
          <circle cx="7" cy="15" r="1.8" fill="#c7d5e0"/>
        </svg>
        <span class="header-logo-text">STEAM</span>
      </div>
      <div class="header-profile">
        <span class="header-wallet" id="wallet">
          <!-- Wallet SVG icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:4px;">
            <rect x="2" y="6" width="20" height="14" rx="2" stroke="#a4d007" stroke-width="2" fill="none"/>
            <circle cx="17" cy="13" r="1.5" fill="#a4d007"/>
            <path d="M2 10h20" stroke="#a4d007" stroke-width="1"/>
          </svg>
          <span id="wallet-amount">250.00</span>€
        </span>
        <!-- User SVG icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;">
          <circle cx="12" cy="8" r="4" stroke="#67c1f5" stroke-width="2" fill="none"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#67c1f5" stroke-width="2" fill="none"/>
        </svg>
        <span class="header-profile-name">Player</span>
      </div>
    </div>
    <nav class="header-nav">
      <div class="nav-links">
        <button class="nav-link active" id="nav-store" onclick="showPage('store')">
          <!-- Store SVG -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M9 22V12h6v10" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Store
        </button>
        <button class="nav-link" id="nav-library" onclick="showPage('library')">
          <!-- Library SVG -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px;">
            <path d="M4 4h2v16H4zM8 4h2v16H8zM13 4l5 16h-2L11 4h2z" fill="currentColor"/>
            <path d="M18 4h2v16h-2z" fill="currentColor"/>
          </svg>
          Library
          <span class="badge" id="library-count"></span>
        </button>
        <button class="nav-link" id="nav-wishlist" onclick="showPage('wishlist')">
          <!-- Wishlist/Star SVG -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px;">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.27 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Wishlist
          <span class="badge" id="wishlist-count"></span>
        </button>
        <button class="nav-link" id="nav-cart" onclick="showPage('cart')">
          <!-- Cart SVG -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px;">
            <circle cx="9" cy="21" r="1" fill="currentColor"/>
            <circle cx="20" cy="21" r="1" fill="currentColor"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="2" fill="none"/>
          </svg>
          Cart
          <span class="badge" id="cart-count"></span>
        </button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search the store" autocomplete="off">
        <button onclick="searchGames()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;">
            <circle cx="11" cy="11" r="8" stroke="#c7d5e0" stroke-width="2" fill="none"/>
            <path d="M21 21l-4.35-4.35" stroke="#c7d5e0" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <div class="main">
    <section class="page-view active" id="page-store">
      <div class="featured" id="featured-section"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="section-header" style="flex:1;margin-bottom:0;">
          <h1 class="section-title" id="store-title">Special Offers</h1>
          <span class="section-more" id="store-subtitle"></span>
        </div>
        <select class="sort-select" id="sort-select" onchange="sortGames()">
          <option value="deal">Best Deal</option>
          <option value="price">Lowest Price</option>
          <option value="title">Name A-Z</option>
          <option value="metacritic">Metacritic</option>
        </select>
      </div>
      <div id="game-grid" class="game-grid"></div>
      <div id="store-loader" class="loader" style="display:none;">
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
      </div>
    </section>
    <section class="page-view" id="page-library">
      <div class="section-header"><h1 class="section-title">My Library</h1><span class="section-more" id="library-subtitle">0 games</span></div>
      <div id="library-list" class="library-list"></div>
    </section>
    <section class="page-view" id="page-wishlist">
      <div class="section-header"><h1 class="section-title">Wishlist</h1><span class="section-more" id="wishlist-subtitle">0 games</span></div>
      <div id="wishlist-list" class="library-list"></div>
    </section>
    <section class="page-view" id="page-cart">
      <div class="section-header"><h1 class="section-title">Shopping Cart</h1><span class="section-more" id="cart-subtitle">0 items</span></div>
      <div id="cart-list" class="library-list"></div>
      <div id="cart-summary" class="cart-summary" style="display:none;">
        <div><div class="cart-total-label">Estimated Total</div><div class="cart-total-value" id="cart-total">0.00€</div></div>
        <button class="btn-purchase" id="btn-purchase-cart" onclick="purchaseCart()">Purchase for myself</button>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModalForce()">✕</button>
      <img class="modal-hero" id="modal-hero" src="" alt="Game banner">
      <div class="modal-content">
        <div class="modal-left">
          <h2 class="modal-game-title" id="modal-title">—</h2>
          <div class="modal-rating-row">
            <span class="modal-rating-tag neutral" id="modal-rating-tag"></span>
            <span class="modal-rating-count" id="modal-rating-count"></span>
          </div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-screenshots" id="modal-screenshots"></div>
          <div class="purchase-box">
            <div class="purchase-title" id="purchase-title">Buy this game</div>
            <div class="purchase-row">
              <span class="discount-badge" id="modal-discount" style="display:none;"></span>
              <div class="price-stack">
                <span class="price-original" id="modal-price-original"></span>
                <span class="price-final" id="modal-price-final"></span>
              </div>
              <button class="btn-add-cart" id="modal-buy-btn" onclick="buyFromModal()">Add to Cart</button>
              <button class="nav-link" id="modal-wish-btn" onclick="toggleWishlist()" style="font-size:1rem;padding:6px 10px;" title="Wishlist">🤍</button>
            </div>
          </div>
        </div>
        <div class="modal-right" id="modal-info-panel"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
